<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World · Mis aplicaciones</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 40px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 16px 48px #1720330a;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(36px, 8vw, 56px);
    }

    p {
      color: #526078;
      line-height: 1.6;
    }

    h2 {
      margin-top: 32px;
      font-size: 20px;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid #dbe4f0;
      border-radius: 12px;
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      background: #eff6ff;
      border-color: #1d4ed8;
    }

    a:focus-visible {
      outline: 3px solid #1d4ed8;
      outline-offset: 4px;
    }

    footer {
      margin-top: 32px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World!</h1>
    <p>
      Bienvenido a mi página. Aquí encontrarás
      las aplicaciones que voy creando.
    </p>

    <h2>Mis aplicaciones</h2>
    <ul>
      <li>
        <a href="/fourier/">Laboratorio de Fourier →</a>
      </li>
      <!-- Añade aquí los enlaces a tus próximas aplicaciones. -->
    </ul>

    <footer>
      ddelapaz1 · Un espacio para aprender y experimentar.
    </footer>
  </main>
</body>
</html>
